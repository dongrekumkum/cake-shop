<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="script.js"></script>
</head>
<body class="bg-pink-50">

<header class="bg-pink-400 text-white p-4 flex justify-between">
  <h1 class="text-xl font-bold">Contact Us</h1>
  <nav class="space-x-4">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="p-6 flex justify-center">
  <form onsubmit="return validateForm()" class="bg-white p-6 rounded shadow-md w-full max-w-md">
    <input type="text" id="name" placeholder="Name" class="w-full p-2 mb-3 border rounded">
    <input type="text" id="email" placeholder="Email" class="w-full p-2 mb-3 border rounded">
    <input type="text" id="mobile" placeholder="Mobile" class="w-full p-2 mb-3 border rounded">
    <textarea id="message" placeholder="Message" class="w-full p-2 mb-3 border rounded"></textarea>
    <button class="w-full bg-pink-400 text-white p-2 rounded">Submit</button>
  </form>
</section>

<footer class="bg-black text-white text-center p-4">
  <p>Email: sweetcake@gmail.com</p>
</footer>

</body>
</html>
